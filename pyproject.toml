[project]
name = "ragbisect"
version = "0.2.0"
description = "Stage-by-stage diagnostics for RAG pipelines: builds its own eval set, scores retrieval, ranking and generation separately, and tells you which stage is the bottleneck."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arunkumar S" }]
keywords = ["rag", "retrieval", "evaluation", "recall", "bm25", "diagnostics", "bisect"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# Deliberately zero runtime dependencies. ragbisect installs alongside the
# user's pipeline; every dependency is a potential version conflict there.
dependencies = []

[project.scripts]
ragbisect = "ragbisect.cli:main"

[project.urls]
Homepage = "https://github.com/mi2arun/ragbisect"
Repository = "https://github.com/mi2arun/ragbisect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbisect"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
